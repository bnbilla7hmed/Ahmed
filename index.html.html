<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسالة خاصة</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<video playsinline loop id="bgVideo" muted>
        <source src="video.mp4" type="video/mp4">
    </video>
    
<audio id="bgAudio" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="overlay" id="overlay">
        <div class="instruction" id="instruction">اضغطي في أي مكان.. ✉️</div>
        
        <div class="message-container" id="messageContainer">
            <p class="message-text">
                منه... عارف إنو بينا حصلت حاجات كتيرة، وجرحتك يمكن بدون ما أقصد... لكن صدقيني، أنا ندمان وبعتذر ليك من قلبي. رغم كل شي، إنتِ لسه نفس الزولة البحبها. وفي حاجة جواي ما اتغيّرت… محبتك. لو في زعل بينا، خلينا نصلحو سوا. أنا دايرك تكوني مرتاحة معاي… بحبك شديد ❤️
            </p>
        </div>
    </div>
    <script src="document.js"></script>
</body>
</html>
